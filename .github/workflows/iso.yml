# The installer ISO, published to the rolling `iso` GitHub release: boot.ps1 and a USB
# stick fetch it from there. Runs on a tag, by hand, or when the ISO's inputs change on main.
name: iso
on:
  push:
    branches: [main]
    paths:
      - nix/iso.nix
      - nix/installer/**
      - templates/**
      - flake.lock
      - .github/workflows/iso.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: ikigai-desktop
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build
        run: |
          nix build --accept-flake-config -L .#iso
          mkdir -p out && cp result/iso/ikigai-x86_64.iso out/
          (cd out && sha256sum ikigai-x86_64.iso > ikigai-x86_64.iso.sha256)
          ls -la out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view iso >/dev/null 2>&1 || gh release create iso --title "Ikigai installer" \
            --notes "The installer ISO, rebuilt by CI. Write it to a USB stick, or run boot.ps1 from Windows."
          gh release upload iso --clobber out/ikigai-x86_64.iso out/ikigai-x86_64.iso.sha256
