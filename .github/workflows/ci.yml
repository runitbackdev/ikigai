# Every push: the flake evaluates, the compositor fork builds, then every Ikigai package,
# then the example system, each stage a job of its own so a failure is one short log and
# each stage's output goes to the ikigai-desktop binary cache before the next starts. An
# install then downloads the fork, the session crate and the shell plugins instead of
# compiling them. Pushing needs the CACHIX_AUTH_TOKEN secret (app.cachix.org, cache
# ikigai-desktop); without it the build still runs and nothing is pushed.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run before it; main always runs to the end, so
# what lands there is built and cached whatever comes after.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: .
          ignore_paths: config themes tools
          additional_files: ikigai-keys ikigai-install

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Evaluate
        run: nix flake check --accept-flake-config --no-build -L

  fork:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: ikigai-desktop
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      - name: cosmic-comp
        run: nix build --accept-flake-config -L --no-link --print-out-paths .#cosmic-comp > "$RUNNER_TEMP/paths"
      # The daemon uploads each path as it is built and the action stops it right after
      # the build, with a 60 s drain hardcoded in cachix; a 40 MB path still in flight
      # fails the job. Queue the outputs again with --wait, which returns once they are up.
      - name: Wait for the push
        if: env.CACHIX_DAEMON_DIR != ''
        run: xargs cachix daemon push --socket "$CACHIX_DAEMON_DIR/daemon.sock" --wait < "$RUNNER_TEMP/paths"

  packages:
    needs: fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: ikigai-desktop
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      - name: Packages
        run: |
          nix build --accept-flake-config -L --no-link --print-out-paths \
            .#ikigai-session .#ikigai-monitor .#ikigai-shell-plugins .#ikigai-shell .#ikigai-theme .#ikigai-icons \
            .#ikigai-cosmic-config .#ikigai-commands .#ikigai-install .#phosphor-font .#zen > "$RUNNER_TEMP/paths"
      # As in fork: wait for the daemon's uploads before the action stops it.
      - name: Wait for the push
        if: env.CACHIX_DAEMON_DIR != ''
        run: xargs cachix daemon push --socket "$CACHIX_DAEMON_DIR/daemon.sock" --wait < "$RUNNER_TEMP/paths"

  system:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: ikigai-desktop
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      - name: Example system
        run: nix build --accept-flake-config -L --no-link --print-out-paths .#nixosConfigurations.example.config.system.build.toplevel > "$RUNNER_TEMP/paths"
      # As in fork: wait for the daemon's uploads before the action stops it.
      - name: Wait for the push
        if: env.CACHIX_DAEMON_DIR != ''
        run: xargs cachix daemon push --socket "$CACHIX_DAEMON_DIR/daemon.sock" --wait < "$RUNNER_TEMP/paths"
