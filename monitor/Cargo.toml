[package]
name = "ikigai-monitor"
version = "0.1.0"
edition = "2024"
publish = false
# magpie-types is GPL-3.0-or-later, so this binary is too (the session crate stays MIT).
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
rustix = { version = "1", features = ["process"] }
signal-hook = "0.4"
# Magpie's wire types, at the submodule commit mission-center v1.2.0 (nixpkgs) ships.
magpie-types = { git = "https://gitlab.com/mission-center-devs/gng.git", rev = "a5272b3c1d853caa4044b737cf49257bfc4c86f2" }

[profile.release]
opt-level = 1
