[package]
name = "ikigai-session"
version = "0.1.0"
edition = "2024"
publish = false

# Handshake shapes mirror cosmic-comp epoch-1.7.0 (src/session.rs).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["process"] }
signal-hook = "0.4"
# The cosmic-protocols rev cosmic-comp resolves in its Cargo.lock.
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4db14c37ed954983158e4055aa94c7741d9" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = 1
